
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Student Management System{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
            color: #263248;
        }

        /* LEFT SIDEBAR */
        .sidebar {
            width: 250px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #1e293b;
            padding: 25px 15px;
            color: white;
            z-index: 1000;
        }

        .sidebar h4 {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 35px;
            padding-left: 10px;
        }

        .sidebar a {
            display: block;
            color: #cbd5e1;
            text-decoration: none;
            padding: 14px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 15px;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background: #334155;
            color: white;
        }

        .sidebar a.active {
            background: #2563eb;
            color: white;
        }

        /* MAIN CONTENT */
        .main-content {
            margin-left: 250px;
            padding: 35px;
            min-height: 100vh;
        }

        .page-heading {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #1e293b;
        }

        .page-description {
            color: #64748b;
            margin-bottom: 25px;
        }

        /* CARDS */
        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin: 30px 0;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 2px 8px #0000000a;
        }

        .card h2 {
            font-size: 30px;
            color: #2563eb;
        }

        .quick-actions {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .quick-actions a {
            background: white;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #ddd;
            text-decoration: none;
            color: #2563eb;
            flex: 1;
        }

        /* FORMS */
        .form-card {
            background: white;
            max-width: 650px;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 3px 12px #0000000d;
            border: 1px solid #e5e7eb;
        }

        .form-label {
            font-weight: 600;
            color: #334155;
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
        }

        .btn-primary {
            background: #2563eb;
            border: none;
            padding: 11px 22px;
            border-radius: 8px;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .sidebar h4 {
                margin-bottom: 15px;
            }

            .sidebar a {
                display: inline-block;
                padding: 10px;
                margin: 3px;
            }

            .main-content {
                margin-left: 0;
                padding: 20px;
            }

            .dashboard-cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .quick-actions {
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            .dashboard-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    {% if user.is_authenticated %}

    <div class="sidebar">

        <h4>🎓 SMS PORTAL</h4>

        <a href="{% url 'dashboard' %}">🏠 Dashboard</a>

        <a href="{% url 'student_list' %}">👨‍🎓 Students</a>

       <a href="{% url 'register' %}">
    <span style="color: #facc15; font-weight: bold;">＋</span> Add Student
</a>


        <a href="{% url 'manage_courses' %}">📚 Manage Courses</a>
        <a href="{% url 'mark_attendance' %}">
    📅 Mark Attendance
</a>
</a>

        <a href="{% url 'logout' %}">🚪 Logout</a>


    </div>

    {% endif %}

    <div class="{% if user.is_authenticated %}main-content{% else %}container py-4{% endif %}">

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}

    </div>

</body>
</html>
