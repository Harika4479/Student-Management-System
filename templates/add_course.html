
{% extends 'base.html' %}

{% block title %}Add New Course | Student Portal{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1 class="page-heading">Add New Course</h1>
        <p class="page-description">
            Add a new course to your student management system.
        </p>
    </div>

    <a href="{% url 'manage_courses' %}"
       class="btn btn-outline-secondary">
        ← Back to Courses
    </a>
</div>

<div class="form-card">

    <h4 class="mb-4">Course Information</h4>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-4">
            <label class="form-label">
                Course Name
            </label>

            <input
                type="text"
                name="course_name"
                class="form-control"
                placeholder="Enter course name (e.g. Python)"
                required
            >

            <small class="text-muted">
                Enter the full name of the course.
            </small>
        </div>

        <div class="d-flex gap-3">

            <button type="submit" class="btn btn-primary">
                + Add Course
            </button>

            <a href="{% url 'manage_courses' %}"
               class="btn btn-outline-secondary">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
