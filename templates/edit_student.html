{% extends 'base.html' %}

{% block content %}

<h2>Edit Student Details</h2>
<p>Update student information</p>

<div class="card p-4 mt-3">

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Student Name</label>
            <input type="text" name="student_name"
                   value="{{ student.student_name }}"
                   class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email"
                   value="{{ student.email }}"
                   class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Mobile Number</label>
            <input type="text" name="mobile_number"
                   value="{{ student.mobile_number }}"
                   class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Course</label>
            <select name="course" class="form-select" required>
                {% for course in courses %}
                <option value="{{ course.course_name }}"
                    {% if student.course == course.course_name %}selected{% endif %}>
                    {{ course.course_name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Current Profile Image</label><br>

            {% if student.profile_image %}
                <img src="{{ student.profile_image.url }}"
                     width="100" height="100"
                     style="object-fit: cover; border-radius: 10px;">
            {% else %}
                <p>No profile image</p>
            {% endif %}
        </div>

        <div class="mb-3">
            <label class="form-label">Change Profile Image</label>
            <input type="file" name="profile_image" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">
            Save Changes
        </button>

        <a href="{% url 'student_list' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
